[package]
name = "venture-backend-template"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[lib]
name = "venture_backend_template"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fz"
path = "src/fz_main.rs"

[dependencies]
# NOTE: the issue text asks for crates named `factory0-*`. Those names were
# never published to crates.io: the upstream project (originally
# Factory-Zero/harness) renamed itself to Cratefield/harness before it
# reached crates.io, and every crate was renamed `cratefield-*` in the
# process. `factory0-*` on crates.io 404s and will never exist. We depend on
# the real, current crates via git, pinned to a specific commit of
# https://github.com/Cratefield/harness for reproducibility.
cratefield-core = { version = "0.10.0" }
cratefield-runtime-cloudflare = { version = "0.5.0" }
cratefield-adapter-resend = { version = "0.4.3" }
cratefield-adapter-turnstile = { version = "0.3.3" }
cratefield-module-email-signup = { version = "0.4.2" }
cratefield-module-waitlist = { version = "0.4.4" }
cratefield-cli = { version = "0.7.1" }
worker = { version = "0.8.5", default-features = false, features = ["d1"] }
async-trait = "0.1.92"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
